<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Hoelni – Game View</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="view.css">
</head>
<body>
  <div id="hud">
    <div id="hud-top"><strong id="hud-title">connecting…</strong><span id="hud-stats"></span></div>
    <div id="crosshair">+</div>
    <div id="hotbar"></div>
    <div id="chat"></div>
    <div id="chat-input-wrap" hidden><input id="chat-input" maxlength="256" placeholder="Chat or /command – Enter to send, Esc to cancel"></div>
    <div id="inventory" hidden></div>
    <div id="help">
      <b>Click</b> to control · <b>WASD</b> move · <b>Space</b> jump · <b>Shift</b> sneak · <b>Ctrl</b> sprint ·
      <b>Mouse</b> look · <b>LMB</b> attack/dig · <b>RMB</b> use/place · <b>1–9</b> hotbar · <b>T</b> chat · <b>E</b> inventory · <b>Esc</b> release
      <button id="hide-btn" title="Back to lightweight AFK mode – the session keeps running">Hide game</button>
    </div>
    <div id="closed" hidden><div><h2>View closed</h2><p id="closed-msg"></p><p>The session keeps running in lightweight mode.</p></div></div>
  </div>
  <script src="/view-io/socket.io.js"></script>
  <script src="index.js"></script>
  <script src="controls.js"></script>
</body>
</html>
