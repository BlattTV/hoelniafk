# Copy to config/app.yaml and adjust. This file contains NO secrets –
# client secrets, passwords and tokens are entered in the UI and stored in the vault.

host: 127.0.0.1          # loopback only
port: 7420
dataDir: data
rulesFile: config/rules.yaml

vault:
  # auto | dpapi | credman | passphrase
  #  auto:       Windows → DPAPI; otherwise HOELNI_VAULT_PASSPHRASE or OS keyring
  #  credman:    master key in Windows Credential Manager (via @napi-rs/keyring)
  keyProvider: auto

oauth:
  # Register your own OAuth apps. Redirect URI for all providers:
  #   http://127.0.0.1:7420/oauth/callback
  microsoft:
    clientId: ""          # Azure app registration ("Mobile and desktop" / public client)
    tenant: consumers     # consumers | common | organizations | <tenant id>
  google:
    clientId: ""          # Google Cloud "Desktop app" OAuth client
  discord:
    clientId: ""          # Discord Developer Portal → OAuth2 (client secret goes into the vault via UI)

network:
  ipEndpoints:
    - https://api.ipify.org
    - https://ifconfig.me/ip
    - https://icanhazip.com

mail:
  syncLimit: 100          # newest N messages per mailbox are indexed (headers only)

automation:
  mailCheckMinutes: 10     # 0 = disabled
  networkCheckMinutes: 30  # 0 = disabled
  discordVerifyHours: 24   # 0 = disabled
  tokenRefreshHours: 12    # keeps Microsoft refresh tokens alive; 0 = disabled
  restoreSessions: true    # desired-state reconciler: sessions that SHOULD be online are (re)started

runtime:
  mode: process            # process = supervised runtime host processes (recommended); inline = in the main process
  sessionsPerHost: 10      # sessions per host process (1 = maximum isolation, ~150 MB per process)
  grouping: pooled         # pooled = fill hosts; identity = keep one identity's sessions together
  heartbeatMs: 5000
  heartbeatTimeoutMs: 30000  # host without heartbeat → killed and restarted, sessions reconnect
  idleHostTtlMs: 60000

sessions:
  reconcileIntervalMs: 3000
  maxConcurrentStarts: 4   # parallel connection attempts (avoid login storms after a restart)

client:                    # the real Minecraft client ("Open game")
  enabled: true
  rootDir: ''              # shared installation; default <dataDir>/minecraft
  instancesDir: ''         # per identity×server game folders; default <dataDir>/instances
  javaPath: ''             # empty = Mojang's Java runtime (downloaded automatically)
  mirrors: {}              # e.g. { piston-meta.mojang.com: 'https://mirror.example/piston-meta' }
  onlineAfterMs: 5000      # handover/background: a login that stays connected this long counts as ONLINE
  joinTimeoutMs: 300000    # the game must reach the server within this time (first start compiles shaders)

logging:
  level: info              # debug | info | warn | error
  file: true               # JSON lines in <dataDir>/logs/hoelni.log
  maxFileMb: 10
  keepFiles: 5
